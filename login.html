<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

                   <title>Login - Amazon Clone</title>

                    <link
                        rel="icon"
                        type="image/png"
                        href="assets/logos/amazon_logo.png"
                    >
     

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>

    <div class="login-page">


        <!-- =========================
             AMAZON LOGO
        ========================== -->

        <div class="login-logo">

            <a href="index.html">

                <img
                    src="assets/logos/amazon_logo.png"
                    alt="Amazon Logo"
                >

            </a>

        </div>



        <!-- =========================
             LOGIN BOX
        ========================== -->

        <div class="login-box">

            <h1>
                Sign in
            </h1>


            <form id="login-form">


                <!-- EMAIL -->

                <label for="email">
                    Email or mobile phone number
                </label>

                <input
                    type="text"
                    id="email"
                    placeholder="Enter your email or mobile number"
                    autocomplete="username"
                    required
                >



                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >



                <!-- SIGN IN -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Sign in
                </button>


            </form>



            <!-- TERMS -->

            <p class="terms">

                By continuing, you agree to our
                Terms and Conditions.

            </p>



            <!-- DIVIDER -->

            <div class="divider">

                <span>
                    New to Amazon Clone?
                </span>

            </div>



            <!-- CREATE ACCOUNT -->

            <a
                href="signup.html"
                class="create-account"
            >
                Create your account
            </a>


        </div>


    </div>



    <!-- LOGIN JS -->

    <script src="js/login.js"></script>


</body>

</html>
