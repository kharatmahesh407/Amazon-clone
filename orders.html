<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders - Amazon Clone</title>
  
    <link
        rel="icon"
        type="image/png"
        href="assets/logos/amazon_logo.png"
    >
        
                   
   


    <!-- NAVBAR CSS -->
    <link
        rel="stylesheet"
        href="css/navbar.css"
    >


    <!-- ORDERS CSS -->
    <link
        rel="stylesheet"
        href="css/orders.css"
    >

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <header>

        <nav class="navbar">


            <!-- AMAZON LOGO -->

            <div class="nav-logo">

                <a href="index.html">

                    <img
                        src="assets/logos/amazon_logo.png"
                        alt="Amazon Logo"
                    >

                </a>

            </div>



            <!-- PAGE TITLE -->

            <h2 class="orders-title">
                My Orders
            </h2>



            <!-- HOME BUTTON -->

            <a
                href="index.html"
                class="orders-home-btn"
            >
                Home
            </a>



            <!-- CART BUTTON -->

            <a
                href="cart.html"
                class="orders-cart-btn"
            >
                🛒 Cart
            </a>


        </nav>

    </header>



    <!-- =========================
         ORDERS PAGE
    ========================== -->

    <main class="orders-page">


        <h1>
            Your Orders
        </h1>


        <!-- ORDERS WILL LOAD HERE -->

        <div id="orders-container">

        </div>


    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/product.js"></script>

    <script src="js/orders.js"></script>


</body>

</html>
