<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

     <title>Order Successful-Amazone clone</title>

                    <link
                        rel="icon"
                        type="image/png"
                        href="assets/logos/amazon_logo.png"
                    >    
            
    
            
          
    
     
    <link
        rel="stylesheet"
        href="css/navbar.css"
    >

    <link
        rel="stylesheet"
        href="css/order-success.css"
    >

</head>


<body>


    <!-- NAVBAR -->

    <header>

        <nav class="navbar">

            <div class="nav-logo">

                <a href="index.html">

                    <img
                        src="assets/logos/amazon_logo.png"
                        alt="Amazon Logo"
                    >

                </a>

            </div>

        </nav>

    </header>



    <!-- SUCCESS PAGE -->

    <main class="success-page">

        <div class="success-box">


            <!-- SUCCESS ICON -->

            <div class="success-icon">
                ✓
            </div>


            <!-- TITLE -->

            <h1>
                Order Placed Successfully!
            </h1>


            <p>
                Thank you for shopping with us.
            </p>


            <p>
                Your order has been confirmed.
            </p>



            <!-- ORDER DETAILS -->

            <div class="success-details">

                <p>

                    <strong>
                        Order ID:
                    </strong>

                    <span id="success-order-id">
                        -
                    </span>

                </p>


                <p>

                    <strong>
                        Total Amount:
                    </strong>

                    <span id="success-total">
                        ₹0
                    </span>

                </p>


                <p>

                    <strong>
                        Payment:
                    </strong>

                    <span id="success-payment">
                        -
                    </span>

                </p>

            </div>



            <!-- BUTTONS -->

            <div class="success-buttons">


                <button
                    class="continue-btn"
                    onclick="window.location.href='index.html'"
                >
                    Continue Shopping
                </button>


                <button
                    class="orders-btn"
                    onclick="window.location.href='orders.html'"
                >
                    View Your Orders
                </button>


            </div>


        </div>

    </main>



    <!-- JAVASCRIPT -->

    <script src="js/order-success.js"></script>


</body>

</html>
